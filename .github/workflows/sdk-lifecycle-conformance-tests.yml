name: Automation regression tests
on:
  pull_request:
    paths:
      - 'cloud-automations/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/**'
      - 'definitions/**'
      - '.github/workflows/sdk-lifecycle-conformance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install verifier's pinned WebSocket dependency
        run: python -m pip install -r cloud-automations/automation-481e4de6-48b1-46b3-a99b-985e7b35ebd3/tarball/requirements.txt
      - name: Run regressions including HTTP and WebSocket reference peers
        run: python -B -m unittest discover -s tests -v
      - name: Verify inactive Cloud package
        run: python scripts/deploy_sdk_conformance.py dry-run
